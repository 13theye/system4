# config.toml for System3

[osc_send]
# OSC receiver's IP address (String)
target_addr = "127.0.0.1"
# OSC receiver's port.
target_port = 8000

[speed]
# beats per minute (float)
bpm = 120.0

[rendering]
texture_width = 3840
texture_height = 2160

# Please don't change these
texture_samples = 1
arc_resolution = 25

[audience_window]
# The size of the audience window game render.
# Currently scaling to 1/2 of texture resolution
width = 3840
height = 2160

[performer_window]
# The size of the performer window game render.
# This size works well for Macbooks
width = 1097
height = 617

[control_window]
# The size of the control window UI.
width = 1440
height = 270

