# config.toml for System4
# ALL FIELDS ARE REQUIRED

[osc_send]
# OSC receiver's IP address (String)
target_addr = "127.0.0.1"
# OSC receiver's port.
target_port = 50452

[osc_receive]
receive_port = 50450

[osc_loop]
# loopback OSC sender
target_addr = "127.0.0.1"
target_port = 50450

[speed]
# initial beats per minute (float)
bpm = 125.0

[rendering]
texture_width = 3840
texture_height = 2160
dpi_scale = 2.0

# Please don't change these
texture_samples = 1
arc_resolution = 25

[audience_window]
# The size of the audience window game render.
width = 1920
height = 1080

[performer_window]
# The size of the performer window game render.
# This size works well for Macbooks
width = 1097
height = 617

[control_window]
# The size of the control window UI.
width = 1512
height = 270

[particles]
limit = 10000



