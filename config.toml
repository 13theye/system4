# config.toml for System4
# ALL FIELDS ARE REQUIRED

[osc_send]
# OSC receiver's IP address (String)
target_addr = "127.0.0.1"
# OSC receiver's port.
target_port = 50452

[osc_receive]
receive_port = 50450

[osc_loop]
# loopback OSC sender
target_addr = "127.0.0.1"
target_port = 50450

[openai_service]
# use the following for local LMStudio
url = "http://localhost:1234/v1"
model = "openai/gpt-oss-20b"
strict_request_object_adherence = false

# use the following for Google Gemma
#model = "models/gemma-3-27b-it"
#url = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
#api_key = "AIzaSyCvu1Ke0PH_2rGPrqp0V9Mx_iA2AwUPvys"
#strict_request_object_adherence = true

# use the following for all AI models
system_prompt = "We are playing a rhythm game. I will send you a rhythm, and you will generate a complex and interesting rhythm that will complement my rhythm when played at the same time. Consider how it will be played with my rhythm. Choose a beat subdivision that will advance the sequence. Generate velocity, length, and cutoff parameters for each note, taking care that each note's timbre and envelope complements the timbre and envelope of the corresponding notes in my rhythm. The rhythm is represented as a string of filled and empty slots. Example: __X___X_ This represents a sequence with a capacity of 8 subdivisions. The X's are the strikes, and the _'s are silent. The rhythm parameters are an array of objects. Each object has the fields: index, velocity, length, cutoff. Example: [{\"i\": 0, \"v\": 0.5, \"l\": 0.5, \"c\": 0.5}] The index being 0 means it is the first slot in the sequence. The length, velocity, and cutoff values range from 0.0 - 1.0 and represent timbre and envelope parameters used in the external sound engine. The number of the objects in the array should be the same as the capacity of the sequence. Generate a haiku that describes your thought process in creating the rhythm and include it in the \"feeling\" field in the schema. The poem may be quite abstract -- be creative. Respond in valid JSON using the rhythm_object_schema provided to you."
#schema_description = "The schema describes parameters needed to create a rhythm sequence. The \"capacity\" is the length of the sequence in beat subdivisions. The \"rhythm\" field is a String representing the rhythm sequence. O is note off, and X is note on. The number of X's and O's should be equal to capacity. No other characters or whitespace are allowed. The field \"i\" is the 0-indexed positions of a note in the sequence. The fields \"v\", \"l\", and \"c\" are parameters describing the velocity, length, and cutoff of each note in the rhythm sequence. Each parameter is a number from 0.0 to 1.0. The \"poem\" field is a String containing the haiku that you are asked to write in the prompt."

[speed]
# initial beats per minute (float)
bpm = 125.0

[rendering]
texture_width = 3840
texture_height = 2160
dpi_scale = 2.0

# Please don't change these
texture_samples = 1
arc_resolution = 25

[audience_window]
# The size of the audience window game render.
width = 1920
height = 1080

[performer_window]
# The size of the performer window game render.
# This size works well for Macbooks
width = 1097
height = 617

[control_window]
# The size of the control window UI.
width = 1512
height = 270

[particles]
limit = 10000



