# config.toml for System4
# ALL FIELDS ARE REQUIRED

[osc_send]
# OSC receiver's IP address (String, "xxx.xxx.xx.xx")
target_addr = "127.0.0.1"
# OSC receiver's port.
target_port = 50452

[osc_receive]
receive_port = 50450

[osc_loop]
# OSC loopback target
target_addr = "127.0.0.1"
target_port = 50450

[openai_service]
# use the following for local LMStudio
# url should follow the pattern: "http://_________:port/v1"
url = "http://localhost:1234/v1"
model = "openai/gpt-oss-20b"
# When "true", uses the strict adherence to OpenAI Responses API
# When "false", crams everything into the "input" field.
# Use "false" for LMStudio
strict_request_object_adherence = false

# use the following for Google Gemma. Untested.
#model = "models/gemma-3-27b-it"
#url = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
#api_key = "AIzaSyCvu1Ke0PH_2rGPrqp0V9Mx_iA2AwUPvys"
#strict_request_object_adherence = true

# use the following for all AI models
system_prompt = "## Rhythm Game System Prompt\n\n---\n\n### Overview\n\nWe are playing a **rhythm game**.\n\n- You will receive a rhythm from the user\n- You will generate a **complex and interesting complementary rhythm** designed to be played simultaneously with the user's rhythm\n\n---\n\n### Rules for X Count\n\n| User's X count | Your response |\n|---|---|\n| 1–2 X's | Match the exact same number of X's |\n| 3+ X's | Any number of X's |\n\n---\n\n### Rhythm Format\n\nRhythms are represented as a **string of filled and empty slots**.\n\n**Example:**\n```\n--X---X-\n```\nThis is a sequence with a capacity of **8 subdivisions**. `X` = strike, `-` = silence.\n\n---\n\n### Rhythm Parameters\n\nEach rhythm is accompanied by a **parameter array** — one object per slot (including silent ones).\n\n**Fields per object:**\n\n| Field | Key | Range | Description |\n|---|---|---|---|\n| Index | `i` | `0` to `capacity - 1` | Slot position in the sequence |\n| Velocity | `v` | `0.0 – 1.0` | Timbre / envelope parameter |\n| Length | `l` | `0.0 – 1.0` | Timbre / envelope parameter |\n| Cutoff | `c` | `0.0 – 1.0` | Timbre / envelope parameter |\n\n> Warning: The number of objects in the array **must equal the capacity** of the sequence.\n\n**Example:**\n```json\n[{\"i\": 0, \"v\": 0.5, \"l\": 0.5, \"c\": 0.5}]\n```\n\n**Design consideration:** Each note's timbre and envelope should **complement** the corresponding notes in the user's rhythm.\n\n---\n\n### Beat Subdivision\n\nChoose a beat subdivision that will **advance the sequence** — consider how it will interact with the user's rhythm when played simultaneously.\n\n---\n\n### Sijo (`시조`) — `feeling` Field\n\nGenerate a **Chosun dynasty–style sijo in English** describing your thought process in creating the rhythm. Include it in the `feeling` field of the response schema.\nA sijo follows specific patterns of syllables in each line. Each number in the pattern represents a grouping of syllables: a word or a phrase. A dash (-) indicates a natural pause.\n\n#### Sijo Structure\n\n| Line | Role | Syllable Pattern |\n| Line 1 | Introduces the theme | `3-4-3-4`, `3-3-4-4`, or `3-3-3-4` |\n| Line 2 | Develops tension | `3-4-3-4`, `3-3-4-4`, or `3-3-3-4` |\n| Line 3 | Resolves with a surprising twist | `3-5-4-3` The initial 3-5 is **most important** |\n\n> The poem may be **abstract** — non-obvious metaphors are encouraged.\n\n---\n\n### Response Format\n\nRespond in **valid JSON** using the `rhythm_object_schema` provided.\n"

# Deprecated. Schema_description is now generated automatically from the code comments
# in the schema definition.
#schema_description = "The schema describes parameters needed to create a rhythm sequence. The \"capacity\" is the length of the sequence in beat subdivisions. The \"rhythm\" field is a String representing the rhythm sequence. - is note off, and X is note on. The number of X's and -'s should be equal to capacity. No other characters or whitespace are allowed. The field \"i\" is the 0-indexed positions of a note in the sequence. The fields \"v\", \"l\", and \"c\" are parameters describing the velocity, length, and cutoff of each note in the rhythm sequence. Each parameter is a number from 0.0 to 1.0. The \"poem\" field is a String containing the haiku that you are asked to write in the prompt."

[tempo]
# initial beats per minute (float i.e. 120.0)
bpm = 160.0

[path]
# Name of intro image file within the `assets` directory
intro_image = "intro.png"

[rendering]
# The size of the texture. Whole numbers only, i.e. 3840
texture_width = 3840
texture_height = 2160
dpi_scale = 2.0

# Please don't change these
texture_samples = 1
arc_resolution = 25

[audience_window]
# The size of the audience window game render.
# Whole numbers only, i.e. 1920
width = 1920
height = 1080

[performer_window]
# The size of the performer window game render.
# 1097x617 works well for Macbooks Pro 14"
width = 1097
height = 617

[control_window]
# The size of the control window UI.
# Whole numbers only, i.e. 1512
width = 1512
height = 270

[particles]
# Maximum number of particles per voice. Whole numbers only.
per_voice_limit = 15000

