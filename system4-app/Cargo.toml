[package]
name = "system4"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
system4-core = { path = "../system4-core" }
crossbeam-channel = "0.5"
egui = "0.23"
glam = "0.29"  # Core uses glam 0.29; Nannou uses 0.17 internally
nannou = "0.19"
nannou_osc = "0.19"
nannou_egui = "0.19"
nnpipe = { path = "../../13thlib/nnpipe" }
prat = { path = "../../13thlib/prat" }
objc2-app-kit = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
rand_distr = "0.5"
rayon = "1.10"
rusty_link = "0.4"
thread-priority = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[lib]
name = "system4"
path = "src/lib.rs"

[[bin]]
name = "system4"
path = "src/main.rs"
