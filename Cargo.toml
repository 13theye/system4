[package]
name = "system4"
authors = ["13th Eye <jjhh@13theye.com>"]
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = "1.13"
egui = "0.23"
nannou = "0.19"
nannou_osc = "0.19"
nannou_egui = "0.19"
nnpipe = { path = "../13thlib/nnpipe", features = ["particles"] }
objc2-app-kit = "0.3"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thread-priority = "2"
toml = "0.8"

[features]
default = ["gpu-particles"]
gpu-particles = []

[lib]
name = "system4"
path = "src/lib.rs"

[[bin]]
name = "system4"
path = "src/main.rs"
