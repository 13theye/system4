[package]
name = "system4"
authors = ["13th Eye <jjhh@13theye.com>"]
version = "0.1.0"
edition = "2021"

[dependencies]
crossbeam-channel = "0.5"
egui = "0.23"
nannou = "0.19"
nannou_osc = "0.19"
nannou_egui = "0.19"
nnpipe = { path = "../13thlib/nnpipe" }
prat = { path = "../13thlib/prat" }
objc2-app-kit = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
rand_distr = "0.5"
rayon = "1.10"
rusty_link = "0.4"
thread-priority = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[lib]
name = "system4"
path = "src/lib.rs"

[[bin]]
name = "system4"
path = "src/main.rs"
